# task.toml — pi-task budget + sandbox configuration (Phases 10-11).
#
# The budget-tier source of truth: which models run the worker pipeline
# (prewalk exploration, execution, forked review) per tier, plus the
# defaults applied when neither the --task-budget flag nor the tool's
# budget parameter locks a tier, the per-tool-call budget, and the
# worker-sandbox policy. See docs/pi-task-design.md → Budget Enforcement
# / Budget Tiers / Worker Sandbox.
#
# BUDGET TIERS ARE CONFIG-DRIVEN (Phase 11): every [budget.*] section in
# this file is a usable tier, in file order — no code change is needed to
# add a tier. The task tool's budget enum, the --task-budget flag choices,
# and the /task-budget command choices are built from these sections plus
# "auto". Editing this file mid-session needs /reload (or a /task-budget
# command) to refresh the schema enum.
#
# Loader: loadTaskConfig() in extensions/task/config.ts (built-in
# defaults apply for any missing file/key; explicitly invalid values
# warn and fall back per field). In the installed layout this file lives
# at ~/.pi/agent/config/task.toml; in the dev workspace it is
# <workspace>/config/task.toml.

[defaults]
# Effective budget mode for unlocked runs — the fallback when no tier is
# locked (the --task-budget flag is "auto" when unset, so a concrete tier
# here always applies to an unlocked run):
#   "auto" — the requirement-count heuristic picks per task
#            (small tasks -> economy, large -> full; never free);
#   any [budget.*] tier name — that tier always applies.
budget = "full"
# Max fix workers the review-fix loop may dispatch before escalating.
max_fix_iterations = 2
# Per-tool-call budget (ms) for a single worker tool execution (bash/read/
# edit/write/grep/find — tracked via tool_execution_start/end). A tool
# running longer than this aborts the worker as hung; the no-progress
# watchdog cannot catch it because an in-flight tool counts as progress.
# 900000 = 15 min (the default when absent).
tool_timeout_ms = 900000
# Per-command budget (ms) for a spec's verification commands, and the
# grace cap when the worker wall-clock expires mid-verification (the
# suite gets to finish, bounded). 900000 = 15 min (the default when
# absent — same as tool_timeout_ms).
verification_timeout_ms = 900000
# Per-review-fork wall budget (ms): each forked review gets its OWN
# wall, independent of (never subtracted from) the worker's per-tier
# wall (wall_timeout_ms above). Default 1200000 = 20 min.
review_wall_timeout_ms = 1200000
# AI commit identity: task-worker commits are authored as this name/email
# (jj reads it via a config override in the worker env; "{model}" is
# replaced with the execute model's short name). Parallel runs build the
# merged commit on an AI-authored base so the squashed result is AI-owned.
# Your own jj/git commits keep your identity.
ai_author_name = "Pi ({model})"
ai_author_email = "noreply@danong.dev"

[budget.max]
# Use the best model for everything.
prewalk_model = "qwen-token-plan/qwen3.8-max-preview"
execute_model = "qwen-token-plan/qwen3.8-max-preview"
review_model = "qwen-token-plan/qwen3.8-max-preview"
review = true
# Per-tier worker wall-clock budget (ms) — the whole worker run, incl.
# prewalk. 2700000 = 45 min.
shape = "code"
wall_timeout_ms = 2700000

[budget.full]
# Strong exploration, fast execution + review.
prewalk_model = "qwen-token-plan/qwen3.8-max-preview"
execute_model = "opencode-go/deepseek-v4-flash"
review_model = "opencode-go/deepseek-v4-flash"
review = true
shape = "code"
wall_timeout_ms = 2700000

[budget.economy]
# Fast model throughout. prewalk_model == execute_model, so the prewalk
# machinery auto-skips (zero overhead). The wall matches max/full (45
# min): a big build under fast models needs the headroom — a 25-min wall
# aborted real suites mid-run (the "merged unverified work" class).
prewalk_model = "opencode-go/deepseek-v4-flash"
execute_model = "opencode-go/deepseek-v4-flash"
review_model = "opencode-go/deepseek-v4-flash"
review = false
shape = "code"
wall_timeout_ms = 2700000

[budget.free]
# Fastest model, no review. prewalk_model == execute_model (no prewalk).
# 30-min wall — the cheapest tier can still hit a real build; 25 min
# proved too tight.
prewalk_model = "opencode/deepseek-v4-flash-free"
execute_model = "opencode/deepseek-v4-flash-free"
review_model = "opencode/deepseek-v4-flash-free"
review = false
shape = "code"
wall_timeout_ms = 1800000

[sandbox]
# Worker bwrap sandbox policy (docs/pi-task-design.md → Worker Sandbox).
# The agent dir (~/.pi/agent) is bound READ-ONLY except for pi's own
# runtime-state paths (settings.json, trust.json, models-store.json,
# sessions/, cache/, results/, tmp/, npm/, .npm-cache), which are rw so the
# worker's pi process can start and run — pi writes settings.json at startup
# (the changelog check records lastChangelogVersion); a read-only bind there
# hangs the worker on the first write (todo #89). The project's shared jj
# store (.jj/.git) is also rw so parallel workspace commits work (todo #89).
# Repo content (config/,
# extensions/, docs/, tracked files) and auth.json stay read-only, so a
# parallel worker still cannot escape its jj workspace through the agent dir;
# the checklist tool is unaffected (its state is session entries, not
# agent-dir files). The orchestrator consumes this when spawning workers
# (extensions/task/sandbox.ts); a missing/disabled bwrap degrades the run to
# unsandboxed spawns with one warning.
enabled = true
# "allow" — host network (workers often need it for verification);
# "isolate" — --unshare-net for stricter environments.
network = "allow"
# Additional bind paths beyond the default allowlist.
extra_ro_binds = []
extra_rw_binds = []

[batch]
# The batch lane (M2): a shape whose channel = "batch" runs the task as an
# ASYNC batch job instead of an interactive worker — one typed single-turn
# prompt per requirement, no tool loop. The orchestrator submits the job,
# polls it to completion, validates each item's output against its contract,
# applies the returned files, commits them (AI identity), and runs the
# spec's verification gate (extensions/task/batch.ts).
#
# model — an OpenRouter `:batch` model id (~50% off list price, up to ~24h
# turnaround). Requires OPENROUTER_API_KEY in the environment; a batch run
# without it fails typed (BatchError "no_api_key").
model = "google/gemini-3.7-flash:batch"
# Poll interval (ms) while the job is in flight.
poll_interval_ms = 30000
# Wall budget (ms) for polling the job to a terminal state (24h — the batch
# lane's advertised turnaround). On timeout the job keeps running
# provider-side; the job-state file (<metrics dir>/<project>/<run>.batch.json)
# records the job id so polling can resume — the failure is typed +
# recoverable.
job_timeout_ms = 86400000


# ─── Run pipeline shapes ([shapes.*]) ────────────────────────────────
# The task's SHAPE: phase structure, swap policy, model slots, and review
# axes — separated from the budget tiers (which pick the models). The task
# tool's `shape` param overrides the tier's default; shapes are recorded in
# the manifest so the same spec can be benchmarked across shapes (prewalk
# on/off, swap on/off).

[shapes.code]
# The default pipeline: strong prewalk plans, swap to the fast execute
# model on the first edit. The default review is ONE adversarial fork
# (the persona used when none is specified); the full declared axis set
# below (standards + spec-fidelity + architecture, parallel forks) is
# the explicit `persona = "parallel"` opt-in for high-stakes/shared code.
prewalk = true
swap = true
work_model = "execute"
review_model = "review"
review = ["standards", "spec-fidelity", "architecture"]

[shapes.analysis]
# Analysis tasks (surveys, design reviews): the STRONG model writes (the
# tier's prewalk model is promoted to the work slot — no swap). No review
# axes: a review/survey is a SINGLE task — the worker IS the review, and
# the quality gate is the spec's Verification commands plus the
# conversational agent's judgment (no nested reviewer).
channel = "sync"
prewalk = false
swap = false
work_model = "prewalk"
review_model = "prewalk"
review = []

[shapes.batch]
# The batch lane (M2): the run is an async batch job on the [batch] model —
# one typed single-turn prompt per requirement, outputs validated against
# their contracts and applied as files, no tool loop, no review. Pick it via
# the task tool's shape param (shape = "batch") or a tier's shape = "batch".
channel = "batch"
prewalk = false
swap = false
work_model = "execute"
review_model = "review"
review = []

#
# ─── Scheduled jobs ([jobs.*]) ───────────────────────────────────────
# The standalone scheduler (extensions/task/scheduler.ts) dispatches a job
# when every_ms has elapsed since its last run, on its channel (flex = a
# detached run; batch = a batch job on the [batch] model). Uncomment to
# enable; restart the scheduler to pick up changes.
#
#    [jobs.weekly-survey]
#    description = "Weekly architecture survey"
#    channel = "flex"          # or "batch" for the async lane
#    tier = "full"
#    shape = "analysis"
#    spec = "file:/workspace/pi-task/canned/survey.md"   # or inline markdown
#    every_ms = 604800000      # 7 days
