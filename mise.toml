# pi-task project manifest (mise).
#
# Everything project-scoped lives here — the image ships the universal
# toolchain (node, python, git, jj, ...). setup installs dev/test deps with
# file-staleness (mise skips when node_modules is newer than the manifests),
# verify is the light toolchain gate the boot sweep runs at startup, test
# is the full hermetic suite (zero LLM calls; the one real-LLM e2e is manual
# and intentionally NOT part of `mise run test`), and typecheck is the
# strict type gate over BOTH engines (core-v2 FR-11 + v1 extensions), plus
# ESLint static analysis and Prettier formatting.

[tasks.setup]
description = "Install dev/test dependencies"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules"]
run = "npm ci --no-audit --no-fund"

[tasks.verify]
description = "Toolchain gate — tsx, pi deps, python3 tomllib, and shipped-config drift"
run = "npx tsx --version && npx tsx extensions/task/test-config.ts"

[tasks.test]
description = "Run the full hermetic test suite (zero LLM calls): v1 + core-v2"
run = "npx tsx extensions/task/test.ts && npx tsx packages/core-v2/test/run-all.ts"

[tasks.v2]
description = "Run one pi-task-v2 task in an isolated jj workspace"
run = "npx tsx packages/core-v2/src/cli.ts"

[tasks.bench-report]
description = "Render a trace benchmark report (pass --trace/--traces-dir/--records and --label)"
run = "npx tsx packages/core-v2/src/bench/report.ts"

[tasks.typecheck]
description = "Type gate — strict tsc over both engines (core-v2 FR-11 + v1 extensions)"
run = "npx tsc --noEmit -p packages/core-v2/tsconfig.json && npx tsc --noEmit -p tsconfig.json"

[tasks.lint]
description = "Static analysis gate — ESLint typescript-eslint recommended-type-checked"
run = "npx eslint extensions packages"

[tasks.fmt]
description = "Format all TypeScript sources with Prettier"
run = "npx prettier --write extensions packages"

# M3 grounding evaluation (docs/pi-task-v2.md §7): scores the v2 grounding
# modes against each other on the pre-seeded suite-03 fixture. The default
# invocation is a DRY plan render — zero LLM calls, zero spawns. Real runs
# need `mise run eval-grounding -- --run` (LLM-gated; strong-model configs
# additionally need --allow-strong or PI_TASK_ALLOW_STRONG=1). Evidence:
# <metrics-dir>/eval-grounding/{records.jsonl,summary.md}.
[tasks.eval-grounding]
description = "Suite-03 grounding-mode evaluation (dry plan by default; --run for real LLM runs)"
run = "npx tsx extensions/task/grounding-eval.ts"
