# pi-task project manifest (mise).
#
# Everything project-scoped lives here — the image ships the universal
# toolchain (node, python, git, jj, ...). setup installs dev/test deps with
# file-staleness (mise skips when node_modules is newer than the manifests),
# verify is the light toolchain gate the boot sweep runs at startup, and test
# is the full hermetic suite (zero LLM calls; the one real-LLM e2e is manual
# and intentionally NOT part of `mise run test`).

[tasks.setup]
description = "Install dev/test dependencies"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules"]
run = "npm ci --no-audit --no-fund"

[tasks.verify]
description = "Toolchain gate — tsx, pi deps, python3 tomllib, and shipped-config drift"
run = "npx tsx --version && npx tsx extensions/task/test-config.ts"

[tasks.test]
description = "Run the full hermetic test suite (zero LLM calls)"
run = "npx tsx extensions/task/test.ts"
